name: Docker Image Cleanup

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/boloo-backend

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package versions
        id: versions
        run: |
          # Get all package versions
          VERSIONS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/boloo-backend/versions" | \
            jq -r '.[].id')

          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Delete old untagged images
        run: |
          echo "Cleaning up old untagged images..."

          # Get all versions
          VERSIONS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/boloo-backend/versions")

          # Delete untagged versions older than 7 days
          echo "$VERSIONS" | jq -r '.[] | select(.metadata.container.tags | length == 0) | select(.updated_at < (now - 604800 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .id' | while read VERSION_ID; do
            echo "Deleting untagged version: $VERSION_ID"
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/packages/container/boloo-backend/versions/$VERSION_ID"
          done

      - name: Keep only last 10 versions
        run: |
          echo "Keeping only last 10 tagged versions..."

          # Get all tagged versions sorted by date
          VERSIONS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/boloo-backend/versions" | \
            jq -r '.[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags | any(. != "latest" and . != "production" and . != "staging")) | .id')

          # Skip first 10, delete the rest
          echo "$VERSIONS" | tail -n +11 | while read VERSION_ID; do
            echo "Deleting old version: $VERSION_ID"
            curl -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/user/packages/container/boloo-backend/versions/$VERSION_ID" || true
          done

      - name: Summary
        run: |
          REMAINING=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/user/packages/container/boloo-backend/versions" | \
            jq '. | length')

          echo "### Cleanup Summary :broom:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Remaining versions:** $REMAINING" >> $GITHUB_STEP_SUMMARY
          echo "**Policy:** Keep last 10 tagged versions + latest/production/staging" >> $GITHUB_STEP_SUMMARY
          echo "**Untagged retention:** 7 days" >> $GITHUB_STEP_SUMMARY
