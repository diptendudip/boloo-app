name: Dependency Updates & Security

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, web, mobile]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up environment (Python)
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up environment (Node.js)
        if: matrix.component == 'web' || matrix.component == 'mobile'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update Python dependencies
        if: matrix.component == 'backend'
        working-directory: ./${{ matrix.component }}
        run: |
          pip install pip-tools
          pip-compile --upgrade requirements.in -o requirements.txt || true
        continue-on-error: true

      - name: Update npm dependencies
        if: matrix.component == 'web' || matrix.component == 'mobile'
        working-directory: ./${{ matrix.component }}
        run: |
          npm update
          npm audit fix || true
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore(${{ matrix.component }}): update dependencies'
          branch: deps/${{ matrix.component }}-updates
          title: '🔧 Update ${{ matrix.component }} dependencies'
          body: |
            ## Dependency Updates for ${{ matrix.component }}

            This PR updates dependencies to their latest compatible versions.

            ### What's Changed
            - Updated all dependencies to latest patch/minor versions
            - Security patches applied where available

            ### Testing Required
            - [ ] All tests pass
            - [ ] No breaking changes detected
            - [ ] Security vulnerabilities resolved

            **Auto-generated by GitHub Actions**
          labels: dependencies, automated
          assignees: ${{ github.repository_owner }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit web dependencies
        working-directory: ./web
        run: |
          npm audit --production --audit-level=moderate || true
          npm audit --json > web-audit.json || true
        continue-on-error: true

      - name: Audit mobile dependencies
        working-directory: ./mobile
        run: |
          npm audit --production --audit-level=moderate || true
          npm audit --json > mobile-audit.json || true
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        working-directory: ./backend
        run: |
          pip install safety
          safety check --json > backend-audit.json || true
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            web/web-audit.json
            mobile/mobile-audit.json
            backend/backend-audit.json
          retention-days: 30
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high
        continue-on-error: true

      - name: Create security issue if vulnerabilities found
        uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security vulnerabilities detected',
              body: 'Security audit has detected vulnerabilities. Please review the audit results.',
              labels: ['security', 'high-priority']
            });
        continue-on-error: true

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check licenses (web)
        working-directory: ./web
        run: |
          npx license-checker --json --out ../web-licenses.json || true
        continue-on-error: true

      - name: Check licenses (mobile)
        working-directory: ./mobile
        run: |
          npx license-checker --json --out ../mobile-licenses.json || true
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python licenses
        working-directory: ./backend
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=../backend-licenses.json || true
        continue-on-error: true

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            web-licenses.json
            mobile-licenses.json
            backend-licenses.json
          retention-days: 90
        continue-on-error: true

  notify:
    name: Send Update Notification
    runs-on: ubuntu-latest
    needs: [update-dependencies, security-audit, license-check]
    if: always()

    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Weekly dependency update and security audit completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
