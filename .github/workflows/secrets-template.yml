# GitHub Secrets Configuration Template
#
# This file lists all required secrets for GitHub Actions workflows.
# DO NOT commit actual secret values - this is just a reference template.
#
# To set secrets, go to: Settings → Secrets and variables → Actions

# =============================================================================
# AZURE DEPLOYMENT SECRETS
# =============================================================================

# Azure Service Principal credentials (JSON format)
# Generate with: az ad sp create-for-rbac --name "boloo-github-actions" --role contributor --scopes /subscriptions/{id}/resourceGroups/{rg} --sdk-auth
AZURE_CREDENTIALS: |
  {
    "clientId": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
    "clientSecret": "your-client-secret",
    "subscriptionId": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx",
    "tenantId": "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  }

# Azure Resource Group name
AZURE_RESOURCE_GROUP: "boloo-production-rg"

# =============================================================================
# BACKEND SECRETS (Production)
# =============================================================================

# PostgreSQL database connection string (boloo-database server)
DATABASE_URL: "postgresql://username:password@boloo-database.postgres.database.azure.com:5432/database?sslmode=require"

# Application secret key (min 32 characters)
SECRET_KEY: "your-secret-key-minimum-32-characters-long"

# =============================================================================
# BACKEND SECRETS (Staging)
# =============================================================================

# Staging database connection string
STAGING_DATABASE_URL: "postgresql://username:password@staging-host:5432/staging_db"

# Staging secret key
STAGING_SECRET_KEY: "staging-secret-key-minimum-32-characters"

# =============================================================================
# WEB FRONTEND SECRETS
# =============================================================================

# Azure Static Web Apps deployment token (Production)
# Get from: Azure Portal → Static Web App → Deployment tokens
AZURE_STATIC_WEB_APPS_API_TOKEN: "your-static-web-apps-deployment-token"

# Azure Static Web Apps deployment token (Staging)
AZURE_STATIC_WEB_APPS_STAGING_TOKEN: "your-staging-deployment-token"

# API URL for web application (Production) - boloo-backend-api
NEXT_PUBLIC_API_URL: "https://boloo-backend-api.azurewebsites.net"

# API URL for staging - boloo-backend-api-staging
STAGING_API_URL: "https://boloo-backend-api-staging.azurewebsites.net"

# Web app URL (Production)
WEB_APP_URL: "https://boloo.app"

# =============================================================================
# MOBILE APP SECRETS
# =============================================================================

# Expo authentication token
# Get from: https://expo.dev/accounts/[account]/settings/access-tokens
EXPO_TOKEN: "your-expo-access-token"

# API URL for mobile app
EXPO_PUBLIC_API_URL: "https://api.boloo.app"

# =============================================================================
# NOTIFICATION SECRETS (Optional)
# =============================================================================

# Slack webhook URL for deployment notifications
# Get from: https://api.slack.com/messaging/webhooks
SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# =============================================================================
# CODE QUALITY & SECURITY SECRETS (Optional)
# =============================================================================

# SonarCloud token for code quality analysis
# Get from: https://sonarcloud.io/account/security
SONAR_TOKEN: "your-sonarcloud-token"

# Snyk token for security scanning
# Get from: https://app.snyk.io/account
SNYK_TOKEN: "your-snyk-api-token"

# Codecov token for coverage reports
# Get from: https://codecov.io/gh/your-org/boloo-app/settings
CODECOV_TOKEN: "your-codecov-token"

# =============================================================================
# AUTOMATION SECRETS (Optional)
# =============================================================================

# Personal Access Token for automated PRs
# Generate with: Settings → Developer settings → Personal access tokens
# Required scopes: repo, workflow
PAT_TOKEN: "ghp_your_personal_access_token"

# =============================================================================
# INSTRUCTIONS FOR SETUP
# =============================================================================
#
# 1. Navigate to your repository on GitHub
# 2. Go to: Settings → Secrets and variables → Actions
# 3. Click "New repository secret"
# 4. Add each secret from above with the actual values
# 5. For multi-line secrets (like AZURE_CREDENTIALS), paste the entire JSON
#
# SECURITY NOTES:
# - Never commit actual secret values to version control
# - Rotate secrets regularly (every 90 days recommended)
# - Use least privilege principle for service principals
# - Enable secret scanning in repository settings
# - Review and audit secret access regularly
#
# TESTING:
# After adding secrets, test with manual workflow dispatch:
# gh workflow run deploy-backend.yml -f environment=staging
#
# =============================================================================
