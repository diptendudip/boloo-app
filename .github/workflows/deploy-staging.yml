name: Deploy to Staging Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  deploy-backend-staging:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://boloo-backend-api-staging.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: boloo-backend-api-staging
          package: ./backend
          slot-name: staging

      - name: Configure staging settings
        uses: azure/appservice-settings@v1
        with:
          app-name: boloo-backend-api-staging
          slot-name: staging
          app-settings-json: |
            [
              {
                "name": "ENVIRONMENT",
                "value": "staging"
              },
              {
                "name": "DATABASE_URL",
                "value": "${{ secrets.STAGING_DATABASE_URL }}"
              },
              {
                "name": "SECRET_KEY",
                "value": "${{ secrets.STAGING_SECRET_KEY }}"
              },
              {
                "name": "DEBUG",
                "value": "true"
              }
            ]

      - name: Run staging migrations
        run: |
          az webapp ssh --name boloo-backend-api-staging --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --command "cd /home/site/wwwroot/backend && alembic upgrade head"
        continue-on-error: true

      - name: Health check
        run: |
          sleep 30
          curl -f https://boloo-backend-api-staging-staging.azurewebsites.net/api/health || exit 1

  deploy-web-staging:
    name: Deploy Web to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.boloo.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Create staging environment file
        working-directory: ./web
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_ENVIRONMENT=staging
          NEXT_PUBLIC_APP_NAME=Boloo Staging
          EOF

      - name: Build Next.js
        working-directory: ./web
        env:
          NODE_ENV: production
        run: npm run build

      - name: Deploy to Azure Static Web Apps (Staging)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_STAGING_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'web/out'
          skip_app_build: true

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-web-staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Run E2E tests
        env:
          BASE_URL: https://staging.boloo.app
          API_URL: https://boloo-backend-api-staging.azurewebsites.net
        run: |
          npx playwright test || true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
        continue-on-error: true

  smoke-tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-web-staging]

    steps:
      - name: API Health Check
        run: |
          curl -f https://boloo-backend-api-staging.azurewebsites.net/api/health || exit 1

      - name: Web App Check
        run: |
          curl -f https://staging.boloo.app || exit 1

      - name: Database Connection Test
        run: |
          response=$(curl -s https://boloo-backend-api-staging.azurewebsites.net/api/health)
          echo $response | grep -q "database.*ok" || exit 1

      - name: Authentication Test
        run: |
          curl -X POST https://boloo-backend-api-staging.azurewebsites.net/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"wrongpassword"}' \
            -f || echo "Auth endpoint working"

  notify:
    name: Send Staging Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-web-staging, smoke-tests]
    if: always()

    steps:
      - name: Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Staging deployment completed!
            Backend: https://boloo-backend-api-staging.azurewebsites.net
            Web: https://staging.boloo.app
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
